<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Custodial inventory · FMES Inventory</title>
  <link rel="stylesheet" href="./assets/inventory.css">
  <script defer src="./assets/viewer.js"></script>
</head>
<body>
  <a href="#main" class="skip">Skip to inventory</a>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><strong>FMES</strong> Inventory</div>
      <span class="read-only"><i class="lock" aria-hidden="true"></i>Read-only</span>
    </div>
  </header>
  <main id="main" class="wrap">
    <div class="intro">
      <div>
        <span class="sample"><i aria-hidden="true"></i>Fictional sample data</span>
        <h1>Custodial inventory</h1>
        <p>View stock levels and the date each product’s quantity last changed.</p>
      </div>
      <div class="shelves" aria-hidden="true">
        <span><i></i><i></i><i></i></span><span><i></i><i></i><i></i></span>
      </div>
    </div>
    <section class="panel" aria-label="Product inventory" data-inventory-src="./data/inventory.sample.json">
      <div class="toolbar">
        <div class="search-control">
          <label for="search">Search products</label>
          <div class="search-box"><i aria-hidden="true"></i><input id="search" type="search" placeholder="Search by product name" autocomplete="off" disabled></div>
        </div>
        <div class="sort-control">
          <label for="sort">Sort by</label>
          <select id="sort" disabled>
            <option value="product-asc">Product (A–Z)</option>
            <option value="product-desc">Product (Z–A)</option>
            <option value="on_hand-desc">On hand (high to low)</option>
            <option value="on_hand-asc">On hand (low to high)</option>
            <option value="last_updated-desc">Last updated (newest first)</option>
            <option value="last_updated-asc">Last updated (oldest first)</option>
          </select>
        </div>
      </div>
      <noscript><p class="no-js">Enable JavaScript to view the inventory file.</p></noscript>
      <div id="inventory-table" hidden>
        <table>
          <caption class="sr-only">Custodial inventory quantities and last modification dates</caption>
          <thead><tr><th scope="col">Product</th><th scope="col">On Hand</th><th scope="col">Last Updated</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="status" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>
</body>
</html>
